spring.application.name=novaprint
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_novaprint?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

management.endpoints.web.exposure.include=health
# Migraciones: Flyway crea el esquema y Hibernate solo lo verifica.
spring.flyway.baseline-on-migrate=true
