<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="campos(servicios)">
    <div class="mb-3">
        <label class="form-label" for="servicioId">Servicio</label>
        <select class="form-select" id="servicioId" name="servicioId" required>
            <option th:each="s : ${servicios}" th:value="${s.id}" th:text="${s.nombre}"
                    th:attr="data-precio=${s.precioUnitario}, data-recargo=${s.recargoColor}, data-doble=${s.permiteDobleCara}">
                Fotocopias</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="cantidad">Cantidad (hojas o unidades)</label>
        <input type="number" class="form-control" id="cantidad" name="cantidad" min="1" max="10000" value="50" required>
    </div>
    <div class="d-flex flex-wrap gap-4 mb-3">
        <div class="form-check form-switch" id="grupoColor">
            <input class="form-check-input" type="checkbox" role="switch" id="color" name="color" value="true">
            <label class="form-check-label" for="color">A color</label>
        </div>
        <div class="form-check form-switch" id="grupoDoble">
            <input class="form-check-input" type="checkbox" role="switch" id="dobleCara" name="dobleCara" value="true">
            <label class="form-check-label" for="dobleCara">Doble cara (10 % menos)</label>
        </div>
    </div>
    <div class="total-box">
        <span>Total estimado</span>
        <strong>S/ <span class="js-total">0.00</span></strong>
    </div>
</div>
</body>
</html>
