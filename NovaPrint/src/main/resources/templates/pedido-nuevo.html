<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Nuevo pedido')}"></head>
<body class="pagina-interna">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="auth-wrap">
    <div class="auth-card auth-card-wide">
        <h2>Nuevo pedido</h2>
        <p class="text-muted">El total final lo confirmamos al recibir tus archivos.</p>
        <div th:if="${param.error}" class="alert alert-danger">Revisa el servicio y la cantidad (entre 1 y 10 000).</div>
        <form th:action="@{/pedidos/guardar}" method="post" class="js-cotizador">
            <div th:replace="~{fragments/campos-pedido :: campos(${servicios})}"></div>
            <div class="mb-3 mt-3">
                <label class="form-label" for="notas">Notas (opcional)</label>
                <textarea id="notas" name="notas" class="form-control" rows="3" maxlength="500"
                          placeholder="Ej.: páginas 1 a 20, tamaño oficio, papel bond 75 g"></textarea>
            </div>
            <button type="submit" class="btn btn-accent w-100">Enviar pedido</button>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scroll.js}"></script>
<script th:src="@{/js/cotizador.js}"></script>
</body>
</html>
