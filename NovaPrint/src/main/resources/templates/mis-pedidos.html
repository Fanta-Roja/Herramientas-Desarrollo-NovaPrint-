<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Mis pedidos')}"></head>
<body class="pagina-interna">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container panel-wrap">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Mis pedidos</h2>
        <a th:href="@{/pedidos/nuevo}" class="btn btn-accent">Nuevo pedido</a>
    </div>
    <div th:if="${param.creado}" class="alert alert-success">¡Pedido enviado! Te avisaremos cuando esté listo.</div>
    <div th:if="${#lists.isEmpty(pedidos)}" class="alert alert-light border">Aún no tienes pedidos. Haz el primero con el botón de arriba.</div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(pedidos)}">
        <table class="table align-middle">
            <thead><tr><th>N.º</th><th>Fecha</th><th>Servicio</th><th>Cantidad</th><th>Opciones</th><th>Total</th><th>Estado</th></tr></thead>
            <tbody>
            <tr th:each="p : ${pedidos}">
                <td th:text="${p.id}">1</td>
                <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}">fecha</td>
                <td th:text="${p.servicio.nombre}">servicio</td>
                <td th:text="${p.cantidad}">50</td>
                <td><span th:if="${p.color}" class="badge text-bg-info me-1">Color</span><span th:if="${p.dobleCara}" class="badge text-bg-secondary">Doble cara</span></td>
                <td>S/ <span th:text="${#numbers.formatDecimal(p.total, 1, 2)}">0.00</span></td>
                <td><span class="badge" th:classappend="${'estado-' + p.estado.name()}" th:text="${p.estado.etiqueta}">Recibido</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scroll.js}"></script>
</body>
</html>
