<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Panel de pedidos')}"></head>
<body class="pagina-interna">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container panel-wrap">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Pedidos recibidos</h2>
        <a th:href="@{/admin/mensajes}" class="btn btn-outline-primary">Ver mensajes de contacto</a>
    </div>
    <div th:if="${#lists.isEmpty(pedidos)}" class="alert alert-light border">Todavía no hay pedidos.</div>
    <div class="table-responsive" th:unless="${#lists.isEmpty(pedidos)}">
        <table class="table align-middle">
            <thead><tr><th>N.º</th><th>Cliente</th><th>Servicio</th><th>Cant.</th><th>Opciones</th><th>Total</th><th>Notas</th><th>Estado</th></tr></thead>
            <tbody>
            <tr th:each="p : ${pedidos}">
                <td th:text="${p.id}">1</td>
                <td><span th:text="${p.usuario.nombre}">Cliente</span><br><small class="text-muted" th:text="${p.usuario.telefono}">tel</small></td>
                <td th:text="${p.servicio.nombre}">servicio</td>
                <td th:text="${p.cantidad}">50</td>
                <td><span th:if="${p.color}" class="badge text-bg-info me-1">Color</span><span th:if="${p.dobleCara}" class="badge text-bg-secondary">Doble cara</span></td>
                <td>S/ <span th:text="${#numbers.formatDecimal(p.total, 1, 2)}">0.00</span></td>
                <td class="small" th:text="${p.notas}">notas</td>
                <td>
                    <form th:action="@{/admin/pedidos/{id}/estado(id=${p.id})}" method="post" class="d-flex gap-2">
                        <select name="estado" class="form-select form-select-sm">
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e.etiqueta}" th:selected="${e == p.estado}">Recibido</option>
                        </select>
                        <button class="btn btn-sm btn-primary" type="submit">Guardar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scroll.js}"></script>
</body>
</html>
