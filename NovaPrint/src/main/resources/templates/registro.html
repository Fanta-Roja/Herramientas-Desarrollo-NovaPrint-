<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Crear cuenta')}"></head>
<body class="pagina-interna">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="auth-wrap">
    <div class="auth-card">
        <h2>Crea tu cuenta</h2>
        <p class="text-muted">Con tu cuenta puedes enviar pedidos y ver su estado.</p>
        <form th:action="@{/procesarRegistro}" th:object="${form}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre completo</label>
                <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input type="email" id="email" class="form-control" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="telefono">Teléfono (9 dígitos)</label>
                <input type="tel" id="telefono" class="form-control" th:field="*{telefono}"
                       th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña (mínimo 6 caracteres)</label>
                <input type="password" id="password" class="form-control" th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmarPassword">Repite la contraseña</label>
                <input type="password" id="confirmarPassword" class="form-control" th:field="*{confirmarPassword}"
                       th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
        </form>
        <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a th:href="@{/login}">Ingresar</a></p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scroll.js}"></script>
</body>
</html>
